<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bahnsteigsvorhersager - {{ station_name }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
    <style>
        .station-switch {
            color: inherit;
            text-decoration: none;
            border-bottom: 3px dotted var(--header-bg);
            transition: opacity 0.2s ease, color 0.2s ease;
            cursor: pointer;
            padding-bottom: 2px;
        }
        .station-switch:hover {
            opacity: 0.8;
            color: #004a8f; /* Lehce modrý nádech při najetí myší */
        }
    </style>
</head>
<body>

    <h1>Bahnsteigsvorhersager - <a href="/{{ next_station_key }}" class="station-switch" title="Kliknutím přepnete na další stanici">{{ station_name }}</a></h1>
    
    <table>
        <thead>
            <tr>
                <th>Čas</th>
                <th>Vlak</th>
                <th>Cíl</th>
                <th>Nástupiště</th>
            </tr>
        </thead>
        <tbody id="board-body">
            <tr><td colspan="4" style="text-align:center; padding: 40px; color: var(--text-muted);">Načítám predikční model...</td></tr>
        </tbody>
    </table>

    <script>
        const STATION_KEY = "{{ station_key }}";
        
        function getGaugeHtml(platformText, probability, isLive) {
            let color = 'var(--gauge-empty)'; 
            let pct = 0;
            let probText = '';

            // Osekání mezer (např. "3 / 6" -> "3/6")
            const cleanPlatform = platformText.replace(/\s+/g, '');

            if (probability !== null) {
                pct = probability;
                probText = `<div class="platform-prob">${pct}%</div>`;
                if (pct >= 75) color = '#2ecc71';      
                else if (pct >= 50) color = '#f39c12'; 
                else color = '#e74c3c';                
            }

            const textClass = isLive ? 'is-live' : 'is-pred';
            
            // Délka rovné čáry v SVG plátně (od X=6 do X=94 je to přesně 88)
            const lineLength = 88;
            const dashOffset = lineLength - ((lineLength * pct) / 100);

            // Čistý design: Číslo -> Čára -> Procenta
            return `
                <div class="bar-wrapper">
                    <div class="platform-number ${textClass}">${cleanPlatform}</div>
                    
                    <svg viewBox="0 0 100 12" class="bar-svg">
                        <!-- Šedé pozadí čáry -->
                        <line x1="6" y1="6" x2="94" y2="6" stroke="var(--gauge-empty)" stroke-width="8" stroke-linecap="round" />
                        <!-- Barevná predikce (vykreslí se zleva doprava) -->
                        <line x1="6" y1="6" x2="94" y2="6" stroke="${color}" stroke-width="8" stroke-linecap="round"
                              stroke-dasharray="${lineLength}" stroke-dashoffset="${lineLength}"
                              style="transition: stroke-dashoffset 1.5s cubic-bezier(0.22, 1, 0.36, 1);"
                              class="bar-anim-path" data-target-offset="${dashOffset}" />
                    </svg>
                    
                    ${probText}
                </div>
            `;
        }

        async function loadBoard() {
            try {
                const response = await fetch(`/api/board/${STATION_KEY}`);
                const trains = await response.json();
                const tbody = document.getElementById('board-body');
                
                let tableHtml = '';

                trains.forEach(train => {
                    let delayHtml = train.delay > 0 ? `<br><span class="delay">+${train.delay} min</span>` : '';
                    let pred = train.prediction;
                    let platformsHtml = '<div class="platforms-container">';

                    if (train.live_platform) {
                        if (pred.status === 'no_data') {
                            platformsHtml += getGaugeHtml(train.live_platform, null, true);
                        } else if (pred.status === 'predict_change') {
                            platformsHtml += getGaugeHtml(train.live_platform, pred.stay_probability, true);
                            if (pred.changes && pred.changes.length > 0) {
                                pred.changes.forEach(change => {
                                    platformsHtml += getGaugeHtml(change.platform, change.probability, false);
                                });
                            }
                        }
                    } else {
                        if (pred.status === 'no_data' || !pred.options || pred.options.length === 0) {
                            platformsHtml += getGaugeHtml('-', null, false);
                        } else if (pred.status === 'predict_new') {
                            pred.options.forEach(opt => {
                                platformsHtml += getGaugeHtml(opt.platform, opt.probability, false);
                            });
                        }
                    }

                    platformsHtml += '</div>';

                    tableHtml += `
                        <tr>
                            <td><strong>${train.time}</strong> ${delayHtml}</td>
                            <td><strong class="train-name">${train.type} ${train.number}</strong></td>
                            <td class="destination">${train.destination}</td>
                            <td>${platformsHtml}</td>
                        </tr>
                    `;
                });

                tbody.innerHTML = tableHtml;

                // Animace rovné čáry
                setTimeout(() => {
                    document.querySelectorAll('.bar-anim-path').forEach(path => {
                        const targetOffset = path.getAttribute('data-target-offset');
                        path.style.strokeDashoffset = targetOffset;
                    });
                }, 50);

            } catch (error) {
                console.error("Chyba při načítání:", error);
                document.getElementById('board-body').innerHTML = '<tr><td colspan="4" style="text-align:center; color: var(--delay-color);">Chyba připojení k serveru</td></tr>';
            }
        }

        loadBoard();
        setInterval(loadBoard, 60000);
    </script>
</body>
</html>
