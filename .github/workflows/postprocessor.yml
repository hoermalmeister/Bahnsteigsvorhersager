name: Vlaky - Noční agregace a úklid (3:00)

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  post-process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - run: pip install -r requirements.txt
      
      - name: Úklid a agregace dat
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python postprocessor.py
