name: Vlaky - Sběr dat

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - run: pip install -r requirements.txt
      
      - name: Spuštění sběru
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scraper.py
